name: OTGS Deploy

on:
  push:
    tags:
      - '*'

env:
  AWS_REGION: "us-east-1"
permissions:
  id-token: write
  # Needed to create the release and attach the package to it.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          path: wpml-elasticpress

      - name: Set github token for composer
        run: composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./wpml-elasticpress

      - name: Build plugin
        run: composer install --no-dev --prefer-dist --no-progress --no-suggest
        working-directory: ./wpml-elasticpress

      - name: Clean up files
        run: |
          rm ./.gitignore ./.gitlab-ci.yml
          rm ./composer.* ./Makefile ./phpcs.* ./phpunit.xml ./run.sh ./phpstan.neon
          rm -Rf tests .vscode
          find . -type d | grep '.git' | xargs rm -rf
        working-directory: ./wpml-elasticpress

      - name: Generate package
        run: zip wpml-elasticpress.${{ github.ref_name }}.zip ./* -r

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: ${{ secrets.GITHUBROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy artifact
        run:
          aws s3 cp ./wpml-elasticpress.${{ github.ref_name }}.zip s3://${{ secrets.S3_BUCKET }}/wpml-elasticpress.${{ github.ref_name }}.zip

      # The release is a DRAFT on purpose. The repository is public, so the
      # package must not be downloadable before the release date. A person
      # publishes the draft when the whole release goes out.
      - name: Attach the package to a draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wpml-elasticpress.${{ github.ref_name }}.zip
          draft: true
          # A tag with a suffix is a pre-release, for example 5.1.0-rc.1.
          prerelease: ${{ contains(github.ref_name, '-') }}
